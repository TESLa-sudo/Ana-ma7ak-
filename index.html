<!DOCTYPE html>
<html lang="ar" dir="rtl" class="notranslate">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>أنا معاك - أمان الموقف والمفقودات</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0F172A">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body class="bg-slate-100 pb-24 font-sans">
    <header class="bg-slate-900 text-white p-4 flex justify-between items-center sticky top-0 z-50">
        <div>
            <h1 class="text-xl font-black text-yellow-400">أنا معاك</h1>
            <p class="text-[10px] text-slate-300">منظومة أمان الموقف والمفقودات</p>
        </div>
        <div class="bg-slate-800 p-1 rounded-xl flex border border-slate-700">
            <button id="btn-driver" onclick="switchRole('driver')" class="px-2.5 py-1 rounded-lg text-xs font-bold bg-yellow-400 text-slate-900">السائق</button>
            <button id="btn-passenger" onclick="switchRole('passenger')" class="px-2.5 py-1 rounded-lg text-xs font-bold text-slate-300">الراكب</button>
        </div>
    </header>

    <main class="p-4 max-w-md mx-auto space-y-4">
        <!-- شاشة السائق والـ QR -->
        <section id="sec-driver" class="bg-slate-900 text-white p-5 rounded-3xl border-2 border-yellow-400 space-y-3">
            <div class="flex justify-between items-center border-b border-slate-700 pb-2">
                <span class="text-xs text-emerald-400 font-bold">🟢 مرخص ومعتمد</span>
                <button onclick="toggleEditForm()" class="text-xs bg-slate-800 hover:bg-slate-700 text-yellow-400 px-2 py-1 rounded-lg border border-slate-600">✏️ تعديل البيانات</button>
            </div>

            <!-- نموذج تعديل بيانات السائق -->
            <form id="driver-form" onsubmit="saveDriverData(event)" class="space-y-2 bg-slate-800 p-3 rounded-2xl hidden">
                <h4 class="text-xs font-bold text-yellow-400 mb-1">تسجيل / تعديل بيانات السائق</h4>
                <div>
                    <label class="text-[10px] text-slate-300 block">اسم السائق</label>
                    <input type="text" id="input-name" required placeholder="مثال: عمر أحمد" class="w-full bg-slate-900 text-white text-xs p-2 rounded border border-slate-700">
                </div>
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="text-[10px] text-slate-300 block">رقم السيارة / اللوحة</label>
                        <input type="text" id="input-plate" required placeholder="مثال: س ب ب 1245" class="w-full bg-slate-900 text-white text-xs p-2 rounded border border-slate-700">
                    </div>
                    <div>
                        <label class="text-[10px] text-slate-300 block">التسعيرة (جنيه)</label>
                        <input type="number" id="input-fare" required placeholder="15" class="w-full bg-slate-900 text-white text-xs p-2 rounded border border-slate-700">
                    </div>
                </div>
                <div>
                    <label class="text-[10px] text-slate-300 block">خط السير</label>
                    <input type="text" id="input-route" required placeholder="مثال: المرج - نزهة جديدة" class="w-full bg-slate-900 text-white text-xs p-2 rounded border border-slate-700">
                </div>
                <div>
                    <label class="text-[10px] text-slate-300 block">رقم الهاتف</label>
                    <input type="tel" id="input-phone" required placeholder="010XXXXXXXX" class="w-full bg-slate-900 text-white text-xs p-2 rounded border border-slate-700">
                </div>
                <button type="submit" class="w-full bg-yellow-400 text-slate-900 font-bold py-1.5 rounded-xl text-xs mt-2">حفظ وإنشاء الـ QR</button>
            </form>

            <!-- عرض بطاقة السائق والـ QR -->
            <div id="driver-card" class="space-y-3">
                <div class="flex justify-between items-start">
                    <div>
                        <span class="text-xs text-yellow-400 font-bold">كابتن السيارة</span>
                        <h2 id="disp-name" class="text-2xl font-black">--</h2>
                        <span id="disp-plate" class="bg-slate-800 text-yellow-300 text-xs px-2 py-1 rounded font-mono font-bold mt-1 inline-block">--</span>
                    </div>
                    <div class="bg-slate-800 p-2 rounded-xl text-left">
                        <span class="text-[10px] text-slate-400 block">التسعيرة</span>
                        <span id="disp-fare" class="text-xl font-black text-yellow-400">-- ج.م</span>
                    </div>
                </div>
                <div class="bg-white p-3 rounded-2xl flex justify-center">
                    <div id="qrcode"></div>
                </div>
                <div class="text-center text-xs space-y-1">
                    <p id="disp-route" class="font-bold">خط السير: --</p>
                    <p id="disp-phone" class="text-yellow-400 font-mono">--</p>
                </div>
            </div>
        </section>

        <!-- واجهة الركاب -->
        <section id="sec-passenger" class="hidden bg-white p-5 rounded-2xl border space-y-3">
            <h3 class="font-black text-slate-900">لوحة خدمات الراكب 🧳</h3>
            <div class="grid grid-cols-2 gap-2">
                <button onclick="alert('تم فتح سجل المفقودات!')" class="p-3 bg-slate-50 rounded-xl border text-right">
                    <div class="text-xl">📦</div>
                    <div class="font-bold text-xs">الإبلاغ عن مفقودات</div>
                </button>
                <button onclick="showFareInfo()" class="p-3 bg-slate-50 rounded-xl border text-right">
                    <div class="text-xl">💵</div>
                    <div class="font-bold text-xs">تسعيرة الخط الرسمية</div>
                </button>
            </div>
        </section>

        <button onclick="alert('🚨 تم إرسال استغاثة طوارئ SOS!')" class="w-full bg-red-600 text-white font-extrabold py-3 rounded-2xl">
            🚨 إرسال إشارة استغاثة طوارئ (SOS)
        </button>
    </main>

    <script>
        let qr = null;

        function genQR(txt) {
            document.getElementById("qrcode").innerHTML = "";
            qr = new QRCode(document.getElementById("qrcode"), { text: txt, width: 150, height: 150 });
        }

        function switchRole(role) {
            if(role === 'driver') {
                document.getElementById('sec-driver').classList.remove('hidden');
                document.getElementById('sec-passenger').classList.add('hidden');
                document.getElementById('btn-driver').className = "px-2.5 py-1 rounded-lg text-xs font-bold bg-yellow-400 text-slate-900";
                document.getElementById('btn-passenger').className = "px-2.5 py-1 rounded-lg text-xs font-bold text-slate-300";
            } else {
                document.getElementById('sec-driver').classList.add('hidden');
                document.getElementById('sec-passenger').classList.remove('hidden');
                document.getElementById('btn-passenger').className = "px-2.5 py-1 rounded-lg text-xs font-bold bg-yellow-400 text-slate-900";
                document.getElementById('btn-driver').className = "px-2.5 py-1 rounded-lg text-xs font-bold text-slate-300";
            }
        }

        function toggleEditForm() {
            const form = document.getElementById('driver-form');
            form.classList.toggle('hidden');
        }

        function saveDriverData(e) {
            e.preventDefault();
            const driverData = {
                name: document.getElementById('input-name').value,
                plate: document.getElementById('input-plate').value,
                fare: document.getElementById('input-fare').value,
                route: document.getElementById('input-route').value,
                phone: document.getElementById('input-phone').value
            };

            localStorage.setItem('driver_data', JSON.stringify(driverData));
            updateUI(driverData);
            toggleEditForm();
        }

        function updateUI(data) {
            document.getElementById('disp-name').innerText = data.name;
            document.getElementById('disp-plate').innerText = data.plate;
            document.getElementById('disp-fare').innerText = data.fare + " ج.م";
            document.getElementById('disp-route').innerText = "خط السير: " + data.route;
            document.getElementById('disp-phone').innerText = data.phone;

            const qrText = `تطبيق أنا معاك\nالسائق: ${data.name}\nالسيارة: ${data.plate}\nالخط: ${data.route}\nالأجرة: ${data.fare} ج.م\nالهاتف: ${data.phone}`;
            genQR(qrText);
        }

        function showFareInfo() {
            const savedData = localStorage.getItem('driver_data');
            if (savedData) {
                const data = JSON.parse(savedData);
                alert(`التسعيرة الرسمية لخط (${data.route}) هي ${data.fare} جنيه.`);
            } else {
                alert('لم يتم تسجيل بيانات التسعيرة لهذا الخط بعد.');
            }
        }

        window.onload = () => {
            const savedData = localStorage.getItem('driver_data');
            if (savedData) {
                const data = JSON.parse(savedData);
                document.getElementById('input-name').value = data.name;
                document.getElementById('input-plate').value = data.plate;
                document.getElementById('input-fare').value = data.fare;
                document.getElementById('input-route').value = data.route;
                document.getElementById('input-phone').value = data.phone;
                updateUI(data);
            } else {
                toggleEditForm(); // فتح الفورم تلقائياً إذا كانت أول مرة
            }
        };

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js');
            });
        }
    </script>
</body>
</html>
